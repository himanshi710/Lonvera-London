<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Lonvera-London/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lonvera London</title>
    <script>
      // Restore the path that was encoded by 404.html into the query string
      (function(l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(1).split('&').reduce(function(memo, item) {
            var parts = item.split('=');
            memo[parts[0]] = parts.slice(1).join('=').replace(/~and~/g, '&');
            return memo;
          }, {});
          var newPath = l.pathname.replace(/\/$/, '') + (decoded['p'] ? '/' + decoded['p'].replace(/^\//, '') : '');
          var newSearch = decoded['q'] ? '?' + decoded['q'] : '';
          window.history.replaceState(null, null, newPath + newSearch + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
